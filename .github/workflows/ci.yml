name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v7

      - name: Verify public repository hygiene
        shell: bash
        run: |
          test -f LICENSE
          if command -v rg >/dev/null 2>&1; then
            stale_refs=$(rg -n "rba_abs_mcp|<your-repo-url>" README.md docs-site examples pyproject.toml fastmcp.json server.json smithery.yaml Dockerfile.smithery || true)
          else
            stale_refs=$(grep -R -n -E "rba_abs_mcp|<your-repo-url>" README.md docs-site examples pyproject.toml fastmcp.json server.json smithery.yaml Dockerfile.smithery || true)
          fi
          if [ -n "$stale_refs" ]; then
            printf '%s\n' "$stale_refs"
            echo "Found stale public references"
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check src tests evals scripts

      - name: Test
        run: uv run pytest

      - name: Wheel import smoke
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          WHEEL_DIR="${RUNNER_TEMP}/ausecon-wheel"
          VENV="${RUNNER_TEMP}/ausecon-wheel-venv"
          uv build --wheel --out-dir "$WHEEL_DIR"
          uv venv "$VENV" --python 3.12
          uv pip install --python "$VENV/bin/python" "$WHEEL_DIR"/*.whl
          "$VENV/bin/python" -c 'import ausecon_mcp.server; from ausecon_mcp.contracts import response_schema; print(response_schema()["$id"])'

      - name: Docker smoke build
        # The Dockerfile pins its own Python, so one matrix leg is enough. Each
        # registry fails on hosted runners in its own way (Docker Hub timeouts,
        # ECR Public per-IP 429s), so each attempt pulls the same official image
        # from a different mirror; mirror.gcr.io first, as ECR's limit hits most runners.
        if: matrix.python-version == '3.12'
        run: |
          images=(
            mirror.gcr.io/library/python:3.12-slim
            public.ecr.aws/docker/library/python:3.12-slim
            docker.io/library/python:3.12-slim
          )
          for attempt in 1 2 3; do
            image="${images[attempt-1]}"
            if docker build . --build-arg "BASE_IMAGE=${image}"; then
              exit 0
            fi
            echo "docker build failed from ${image} (attempt ${attempt}/3); retrying in 30s..."
            sleep 30
          done
          echo "docker build failed after 3 attempts"
          exit 1
