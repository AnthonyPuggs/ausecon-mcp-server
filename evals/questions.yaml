# Eval question manifest. Validated per-PR by tests/test_eval_manifest.py.
# pinned = finalized, never-revising answers. live = resolved at run time
# against the local AuseconService (see evals/resolve.py).

- id: pinned_cash_rate_aug_2016
  question: "What cash rate target did the Reserve Bank of Australia announce at its August 2016 board meeting? Answer in per cent."
  answer_type: pinned
  category: monetary_policy
  source: rba
  expected_value: 1.5
  expected_period: "2016-08-03"
  tolerance: 0.0
  unit: "per cent"
  note: "Published RBA policy decision; never revised. Matches golden rba_new_cash_rate_target_2016_08_03."

- id: pinned_cash_rate_change_aug_2016
  question: "By how many percentage points did the RBA change the cash rate target at its August 2016 meeting? Use a negative number for a cut."
  answer_type: pinned
  category: monetary_policy
  source: rba
  expected_value: -0.25
  expected_period: "2016-08-03"
  tolerance: 0.0
  unit: "percentage points"
  note: "Published RBA policy decision; never revised. Matches golden rba_change_in_cash_rate_target_2016_08_03."

- id: pinned_cpi_index_2015_q1
