name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v7

      - name: Verify public repository hygiene
        shell: bash
        run: |
          test -f LICENSE
          if command -v rg >/dev/null 2>&1; then
            stale_refs=$(rg -n "rba_abs_mcp|<your-repo-url>" README.md docs-site examples pyproject.toml fastmcp.json server.json smithery.yaml Dockerfile.smithery || true)
          else
            stale_refs=$(grep -R -n -E "rba_abs_mcp|<your-repo-url>" README.md docs-site examples pyproject.toml fastmcp.json server.json smithery.yaml Dockerfile.smithery || true)
          fi
          if [ -n "$stale_refs" ]; then
            printf '%s\n' "$stale_refs"
            echo "Found stale public references"
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check src tests evals scripts

      - name: Test
        run: uv run pytest

      - name: Wheel import smoke
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          WHEEL_DIR="${RUNNER_TEMP}/ausecon-wheel"
          VENV="${RUNNER_TEMP}/ausecon-wheel-venv"
          uv build --wheel --out-dir "$WHEEL_DIR"
          uv venv "$VENV" --python 3.12
          uv pip install --python "$VENV/bin/python" "$WHEEL_DIR"/*.whl
          "$VENV/bin/python" -c 'import ausecon_mcp.server; from ausecon_mcp.contracts import response_schema; print(response_schema()["$id"])'

      - name: Docker smoke build
        # Docker Hub metadata requests intermittently time out on hosted
        # runners, so retry transient failures before declaring defeat.
        run: |
          for attempt in 1 2 3; do
            if docker build .; then
              exit 0
            fi
            echo "docker build failed (attempt ${attempt}/3); retrying in 30s..."
            sleep 30
          done
          echo "docker build failed after 3 attempts"
          exit 1
